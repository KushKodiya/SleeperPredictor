league:
  platform: sleeper
  league_id: "REPLACE_ME"          # string, not int — Sleeper IDs overflow int32
  draft_id: "REPLACE_ME"
  my_user_id: "REPLACE_ME"
  season: 2026
  teams: 8
  rounds: 15
  # Roster slots are FETCHED from Sleeper, not configured here.
  # This block is a fallback only if the API is unreachable.
  fallback_roster_positions: ["QB","RB","RB","WR","WR","TE","FLEX","FLEX","K","DEF",
                              "BN","BN","BN","BN","BN"]

flex_eligibility:
  FLEX:       ["RB", "WR", "TE"]
  SUPER_FLEX: ["QB", "RB", "WR", "TE"]
  REC_FLEX:   ["WR", "TE"]
  WRRB_FLEX:  ["RB", "WR"]

data:
  cache_dir: "data/raw"
  history_seasons: [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
  sleeper_players_ttl_hours: 24
  adp_ttl_hours: 12

crosswalk:
  fuzzy_threshold: 92              # rapidfuzz score below which we do NOT match
  unmatched_report: "data/interim/unmatched.csv"

calibration:
  method: isotonic                 # isotonic | linear | none
  min_training_seasons: 6
  fit_pool:                        # match FFA's evaluation frame
    QB: 20
    RB: 40
    WR: 40
    TE: 20

replacement:
  method: waiver_empirical         # waiver_empirical | last_starter | static_rank
  waiver_lookback_seasons: 5
  waiver_percentile: 0.50          # median weekly FA production by position

simulation:
  # A scenario is one way the rest of the draft falls; n_sims is how many seasons are
  # drawn inside each one. Most of the variance in Q lives in how the board falls, not in
  # the seasons that follow, so scenarios are what buy a stable recommendation -- and a
  # scenario is also what costs, because it replays the whole remaining draft.
  #
  # Measured on the owner's machine, first pick of a 15-round 8-team draft, 256-player
  # board, 15 candidates (see the phase 8 gate):
  #    32 scenarios x  64 sims ->  7.2s
  #    64 scenarios x 128 sims -> 19.7s   <- chosen: 25s of margin under the budget
  #   128 scenarios x 256 sims -> 60.6s   (over)
  # n_sims_live was 2000 in the PRD. That predates the scenario loop, which is where the
  # draws actually have to go; 64 x 128 spends more total draws than 2000 ever did.
  n_sims_live: 128
  n_sims_backtest: 32
  n_scenarios_live: 64
  # The backtest runs 600 recommendations over historical boards twice the size of a live
  # one, so it takes a quarter of the live scenario count to finish in under an hour.
  n_scenarios_backtest: 16
  # Championship equity multiplies the season half of the work by the number of teams, so
  # it needs its own budget. Measured on the owner's machine, first pick, 256-player board,
  # 15 candidates, against the live 45s budget:
  #    2 scenarios x   8 sims ->  0.8s   (standard error 0.133 -- far too noisy to rank on)
  #    8 scenarios x  32 sims ->  5.4s   (se 0.015)
  #   16 scenarios x  64 sims -> 15.9s   <- chosen: se 0.013, 29s of margin
  #   32 scenarios x 128 sims -> 53.9s   (over)
  # A title is a Bernoulli outcome per sim, so Q is far noisier than a points mean at the
  # same sample count; the error, not the runtime, is what sets the floor here.
  n_scenarios_equity: 16
  n_sims_equity: 64
  shortlist_size: 10
  force_best_at_each_position: true
  common_random_numbers: true
  time_budget_seconds: 45
  objective: expected_points       # expected_points | championship_equity

opponent_model:
  # ADP is the population prior. There is NO way to enumerate public Sleeper
  # drafts, so we do not crawl for one. See M11.
  type: adp_prior_plus_deviations
  prior: adp                       # adp | uniform
  fit_deviations: true             # per-manager terms, partially pooled
  shrinkage: empirical_bayes
  shrinkage_prior_strength: 40     # pseudo-picks toward the population mean
  min_picks_to_fit_manager: 30     # below this, manager == league average
  temperature_init: 1.0            # fitted; the single most valuable parameter
  adp_noise_sigma_rounds: 1.2      # pure-fallback model if fitting fails
  ridge_penalty: 0.0               # L2 on the deviation coefficients. Selected on a held-out
                                   # validation split: every non-zero value made prediction
                                   # monotonically worse here (2.01 -> 3.83 log loss). Kept as a
                                   # knob for a thinner dataset that does need shrinking.

availability:
  games_per_season: 17
  model: empirical_by_age_position   # see M16
  lookback_seasons: 10
  age_bin_width: 1
  min_bin_count: 30                  # below this, pool to position-wide rate
  workload_percentile_flag: 0.80     # prior-season snap volume above this = its own cell (see M16)
  rosterable_percentile: 0.50        # train on players at/above this prior-snap percentile;
                                     # below it the population is fringe players who never had a role

overrides:
  projection_overrides: "overrides/projection_overrides.csv"
  player_id_overrides: "overrides/player_id_overrides.csv"
  reload_on_every_pick: true         # so draft-morning edits take effect live

runtime:
  poll_interval_seconds: 2.0
  http_timeout_seconds: 10.0
  http_max_retries: 3
  anomaly_log: "data/interim/draft_anomalies.log"   # every live-draft anomaly, for post-draft review
